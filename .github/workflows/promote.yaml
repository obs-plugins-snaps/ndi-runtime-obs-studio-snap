name: Promote snap

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Revision (number or 'latest')"
        required: false
        default: latest
      channel:
        description: "Target risk level"
        required: true
        type: choice
        options:
          - beta
          - candidate
          - stable

jobs:
  promote:
    uses: obs-plugins-snaps/workflows/.github/workflows/promote.yml@main
    with:
      plugin_name: "ndi-runtime"
      revision: "${{ github.event.inputs.revision }}"
      channel: "${{ github.event.inputs.channel }}"
    secrets: inherit
