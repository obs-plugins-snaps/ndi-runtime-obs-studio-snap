name: Build snap

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: canonical/craft-actions/snapcraft/pack@main
        id: pack
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.snap }}
          path: ${{ steps.pack.outputs.snap }}
