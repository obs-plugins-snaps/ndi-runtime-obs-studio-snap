summary: "Proprietary NDI SDK shared runtime library"
license: Proprietary
description: |
  Provides the proprietary NDI SDK runtime library (libndi.so) for
  OBS Studio plugin snaps like DistroAV.

  NDI® is a registered trademark of Vizrt NDI AB.
  See https://ndi.video for licensing details.

  **Installation**

  Install the snap:

      sudo snap install ndi-runtime-obs-studio

  Then connect it to the OBS Studio snap:

      sudo snap connect obs-studio:obs-plugins ndi-runtime-obs-studio:obs-plugins

  Once connected, the plugin will be available in OBS Studio after restarting
  it.

